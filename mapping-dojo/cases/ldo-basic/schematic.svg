<svg viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg">
  <style>
    .component { cursor: pointer; }
    .component line, .component path, .component rect, .component circle { stroke: #333; stroke-width: 2; fill: none; }
    .component text { font-family: sans-serif; font-size: 16px; fill: #111; pointer-events: none; }
    .net line, .net path { stroke-width: 2; }
    .pin circle { fill: #fff; stroke: #333; stroke-width: 2; cursor: crosshair; }
    .hide-labels .component text { display: none; }
  </style>
  <rect x="0" y="0" width="980" height="520" fill="#fdfdfb"/>

  <!-- ===== 网络连线（导线） ===== -->
  <!-- VIN: J1(+) -> 顶部横线 -> C1正极 / U1 VIN -->
  <g class="net" data-net="VIN">
    <path d="M170 140 H330 M330 140 V230 M330 140 H520 M520 140 V230" stroke="#ef4444"/>
  </g>
  <!-- VOUT: U1 VOUT -> 右侧横线 -> C2上端 / R1左端 -->
  <g class="net" data-net="VOUT">
    <path d="M520 330 V390 H760 M640 390 V330 M760 390 V330" stroke="#f97316"/>
  </g>
  <!-- GND: 底部地线 -->
  <g class="net" data-net="GND">
    <path d="M170 450 H820 M170 450 V330 M330 450 V330 M520 450 V330 M640 450 V330 M820 450 V330" stroke="#22c55e"/>
  </g>

  <!-- 节点圆点 -->
  <circle cx="330" cy="140" r="4" fill="#333"/>
  <circle cx="520" cy="140" r="4" fill="#333"/>
  <circle cx="640" cy="390" r="4" fill="#333"/>

  <!-- ===== J1：DC 电源插座符号 ===== -->
  <g class="component" data-component="J1">
    <circle cx="140" cy="140" r="20"/>
    <line x1="140" y1="140" x2="128" y2="128"/>
    <line x1="170" y1="140" x2="160" y2="140"/>
    <text x="110" y="95">J1 DC 5V</text>
    <g class="pin" data-component="J1" data-pin="VIN" data-net="VIN"><circle cx="170" cy="140" r="5"/></g>
    <g class="pin" data-component="J1" data-pin="GND" data-net="GND"><circle cx="170" cy="330" r="5"/></g>
    <line x1="140" y1="160" x2="140" y2="330"/>
    <line x1="140" y1="330" x2="170" y2="330"/>
  </g>

  <!-- ===== C1：电解电容符号（有极性） ===== -->
  <g class="component" data-component="C1">
    <line x1="330" y1="230" x2="330" y2="278"/>
    <line x1="305" y1="278" x2="355" y2="278"/>
    <path d="M305 296 Q330 284 355 296"/>
    <line x1="330" y1="296" x2="330" y2="330"/>
    <text x="362" y="272">+ 10uF</text>
    <text x="340" y="230">C1</text>
    <g class="pin" data-component="C1" data-pin="POS" data-net="VIN"><circle cx="330" cy="230" r="5"/></g>
    <g class="pin" data-component="C1" data-pin="NEG" data-net="GND"><circle cx="330" cy="330" r="5"/></g>
  </g>

  <!-- ===== U1：LDO 三端稳压器符号 ===== -->
  <g class="component" data-component="U1">
    <rect x="470" y="250" width="100" height="60" rx="4"/>
    <line x1="520" y1="230" x2="520" y2="250"/>
    <line x1="520" y1="310" x2="520" y2="330"/>
    <line x1="470" y1="280" x2="440" y2="280"/>
    <text x="482" y="272" font-size="12">IN</text>
    <text x="482" y="302" font-size="12">GND</text>
    <text x="536" y="272" font-size="12">OUT</text>
    <text x="490" y="215">U1 LDO 3.3V</text>
    <g class="pin" data-component="U1" data-pin="VIN" data-net="VIN"><circle cx="520" cy="230" r="5"/></g>
    <g class="pin" data-component="U1" data-pin="GND" data-net="GND"><circle cx="440" cy="280" r="5"/></g>
    <g class="pin" data-component="U1" data-pin="VOUT" data-net="VOUT"><circle cx="520" cy="330" r="5"/></g>
    <!-- GND 引脚接到底部地线 -->
    <path d="M440 280 H420 V450" stroke="#22c55e"/>
  </g>

  <!-- ===== C2：陶瓷电容符号（无极性） ===== -->
  <g class="component" data-component="C2">
    <line x1="640" y1="330" x2="640" y2="370"/>
    <line x1="615" y1="370" x2="665" y2="370"/>
    <line x1="615" y1="384" x2="665" y2="384"/>
    <line x1="640" y1="384" x2="640" y2="424"/>
    <text x="672" y="382">100nF</text>
    <text x="650" y="330">C2</text>
    <g class="pin" data-component="C2" data-pin="1" data-net="VOUT"><circle cx="640" cy="330" r="5"/></g>
    <g class="pin" data-component="C2" data-pin="2" data-net="GND"><circle cx="640" cy="424" r="5"/></g>
    <line x1="640" y1="424" x2="640" y2="450"/>
  </g>

  <!-- ===== R1：轴向电阻符号 ===== -->
  <g class="component" data-component="R1">
    <line x1="760" y1="330" x2="760" y2="290"/>
    <rect x="748" y="240" width="24" height="50" rx="3"/>
    <line x1="760" y1="240" x2="760" y2="210"/>
    <text x="782" y="268">1k</text>
    <text x="770" y="210">R1</text>
    <g class="pin" data-component="R1" data-pin="1" data-net="VOUT"><circle cx="760" cy="330" r="5"/></g>
    <g class="pin" data-component="R1" data-pin="2" data-net="GND"><circle cx="820" cy="210" r="5"/></g>
    <path d="M760 210 H820 V450" stroke="#22c55e"/>
    <line x1="820" y1="450" x2="820" y2="440"/>
  </g>

  <!-- 接地符号 -->
  <g>
    <line x1="150" y1="470" x2="190" y2="470" stroke="#333" stroke-width="2"/>
    <line x1="158" y1="478" x2="182" y2="478" stroke="#333" stroke-width="2"/>
    <line x1="165" y1="486" x2="175" y2="486" stroke="#333" stroke-width="2"/>
    <line x1="170" y1="450" x2="170" y2="470" stroke="#333" stroke-width="2"/>
  </g>
</svg>
